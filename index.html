<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THD Cal. 工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        [x-cloak] { display: none !important; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col md:flex-row" x-data="app()" x-cloak>

    <!-- 左側工具選單 (Sidebar) -->
    <aside class="w-full md:w-56 bg-slate-900 text-white shrink-0 flex flex-col justify-between">
        <div>
            <div class="p-4 font-bold text-base border-b border-slate-800 flex justify-between items-center">
                <span>⚡ 工程計算工具</span>
                <button @click="resetData()" class="text-xs text-slate-400 hover:text-rose-400 font-normal underline">重設數據</button>
            </div>
            <nav class="p-2 flex md:flex-col gap-1 overflow-x-auto">
                <button @click="tab = 'thd'" 
                        :class="tab === 'thd' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'" 
                        class="px-3 py-2.5 rounded-lg text-left text-xs font-semibold whitespace-nowrap transition">
                    1. THD Cal.
                </button>
                <button @click="tab = 'tool2'" 
                        :class="tab === 'tool2' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'" 
                        class="px-3 py-2.5 rounded-lg text-left text-xs font-semibold whitespace-nowrap transition">
                    2. 預留工具 (待加)
                </button>
            </nav>
        </div>
        <div class="hidden md:block p-4 text-[11px] text-slate-500 border-t border-slate-800">
            自動記憶功能已啟用
        </div>
    </aside>

    <!-- 右側主畫面 -->
    <main class="flex-1 p-4 md:p-8 overflow-x-auto">
        
        <!-- 工具 1：THD Cal. -->
        <div x-show="tab === 'thd'" class="max-w-2xl bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-lg font-bold text-slate-800">THD Cal.</h1>
                <button @click="addGroup()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                    + 新增一組計算
                </button>
            </div>

            <!-- 仿 Excel 表格 -->
            <div class="overflow-x-auto">
                <table class="w-full border-collapse border border-slate-300 text-sm text-center">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 font-semibold">
                            <th class="border border-slate-300 py-2 px-2 w-12">相</th>
                            <th class="border border-slate-300 py-2 px-3">Current</th>
                            <th class="border border-slate-300 py-2 px-3">THD</th>
                            <th class="border border-slate-300 py-2 px-3">System<br>Current</th>
                            <th class="border border-slate-300 py-2 px-3 bg-amber-50">Final<br>THD</th>
                            <th class="border border-slate-300 py-2 px-1 w-8"></th>
                        </tr>
                    </thead>

                    <template x-for="(group, gIdx) in groups" :key="group.id">
                        <tbody class="border-t-2 border-slate-400">
                            <!-- L1 -->
                            <tr>
                                <td class="border border-slate-300 font-semibold text-xs text-slate-500 bg-slate-50">L1</td>
                                <td class="border border-slate-300 p-0">
                                    <input type="number" step="any" inputmode="decimal" x-model.number="group.l1.c" @input="save()"
                                           class="w-full h-11 text-center focus:outline-none focus:bg-indigo-50/50 font-medium">
                                </td>
                                <td class="border border-slate-300 p-0">
                                    <input type="number" step="any" inputmode="decimal" x-model.number="group.l1.t" @input="save()"
                                           class="w-full h-11 text-center focus:outline-none focus:bg-indigo-50/50 font-medium">
                                </td>
                                <!-- System Current 跨三行 (rowspan="3") -->
                                <td class="border border-slate-300 p-0 bg-slate-50/50" rowspan="3">
                                    <input type="number" step="any" inputmode="decimal" x-model.number="group.sys" @input="save()"
                                           class="w-full h-32 text-center bg-transparent focus:outline-none focus:bg-indigo-50/50 font-bold text-indigo-700">
                                </td>
                                <td class="border border-slate-300 font-bold text-slate-900 bg-amber-50/40 px-2" 
                                    x-text="calc(group.l1.c, group.l1.t, group.sys)"></td>
                                <!-- 刪除整組按鈕 (跨三行) -->
                                <td class="border border-slate-300 bg-slate-50" rowspan="3">
                                    <button @click="removeGroup(group.id)" x-show="groups.length > 1" class="text-slate-400 hover:text-rose-500 text-xs p-1" title="刪除此組">✕</button>
                                </td>
                            </tr>
                            <!-- L2 -->
                            <tr>
                                <td class="border border-slate-300 font-semibold text-xs text-slate-500 bg-slate-50">L2</td>
                                <td class="border border-slate-300 p-0">
                                    <input type="number" step="any" inputmode="decimal" x-model.number="group.l2.c" @input="save()"
                                           class="w-full h-11 text-center focus:outline-none focus:bg-indigo-50/50 font-medium">
                                </td>
                                <td class="border border-slate-300 p-0">
                                    <input type="number" step="any" inputmode="decimal" x-model.number="group.l2.t" @input="save()"
                                           class="w-full h-11 text-center focus:outline-none focus:bg-indigo-50/50 font-medium">
                                </td>
                                <td class="border border-slate-300 font-bold text-slate-900 bg-amber-50/40 px-2" 
                                    x-text="calc(group.l2.c, group.l2.t, group.sys)"></td>
                            </tr>
                            <!-- L3 -->
                            <tr>
                                <td class="border border-slate-300 font-semibold text-xs text-slate-500 bg-slate-50">L3</td>
                                <td class="border border-slate-300 p-0">
                                    <input type="number" step="any" inputmode="decimal" x-model.number="group.l3.c" @input="save()"
                                           class="w-full h-11 text-center focus:outline-none focus:bg-indigo-50/50 font-medium">
                                </td>
                                <td class="border border-slate-300 p-0">
                                    <input type="number" step="any" inputmode="decimal" x-model.number="group.l3.t" @input="save()"
                                           class="w-full h-11 text-center focus:outline-none focus:bg-indigo-50/50 font-medium">
                                </td>
                                <td class="border border-slate-300 font-bold text-slate-900 bg-amber-50/40 px-2" 
                                    x-text="calc(group.l3.c, group.l3.t, group.sys)"></td>
                            </tr>
                        </tbody>
                    </template>
                </table>
            </div>

            <div class="mt-3 text-xs text-slate-400">
                計算公式：Final THD = (Current × THD) ÷ System Current
            </div>
        </div>

        <!-- 預留工具 2 -->
        <div x-show="tab === 'tool2'" class="max-w-2xl bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500 text-sm">
            這裡預留給你的下一個計算工具，隨時告訴我要加什麼公式即可！
        </div>

    </main>

    <script>
        function app() {
            const STORAGE_KEY = 'simple_thd_cal_v1';
            // 預設放入你圖片中的兩組數據
            const defaultGroups = [
                {
                    id: 1,
                    sys: 8.96,
                    l1: { c: 1.07, t: 34.5 },
                    l2: { c: 1.127, t: 32.4 },
                    l3: { c: 0.96, t: 42.5 }
                },
                {
                    id: 2,
                    sys: 15.73,
                    l1: { c: 0.574, t: 112 },
                    l2: { c: 0.516, t: 101 },
                    l3: { c: 0.649, t: 107 }
                }
            ];

            let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (!saved) saved = JSON.parse(JSON.stringify(defaultGroups));

            return {
                tab: 'thd',
                groups: saved,

                calc(c, t, sys) {
                    const current = Number(c) || 0;
                    const thd = Number(t) || 0;
                    const sysCurrent = Number(sys) || 0;
                    if (sysCurrent === 0) return '-';
                    const res = (current * thd) / sysCurrent;
                    // 顯示最多 6 位小數，並自動去掉尾端多餘的 0 (與 Excel 顯示一致)
                    return Number(res.toFixed(6));
                },

                addGroup() {
                    this.groups.push({
                        id: Date.now(),
                        sys: 10,
                        l1: { c: 0, t: 0 },
                        l2: { c: 0, t: 0 },
                        l3: { c: 0, t: 0 }
                    });
                    this.save();
                },

                removeGroup(id) {
                    this.groups = this.groups.filter(g => g.id !== id);
                    this.save();
                },

                resetData() {
                    if (confirm('要還原成預設範例數據嗎？')) {
                        this.groups = JSON.parse(JSON.stringify(defaultGroups));
                        this.save();
                    }
                },

                save() {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.groups));
                }
            }
        }
    </script>
</body>
</html>
