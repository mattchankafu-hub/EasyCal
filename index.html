<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THD Cal. 工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col md:flex-row" x-data="app()" x-cloak>

    <!-- 左側工具選單 (Sidebar) -->
    <aside class="w-full md:w-56 bg-slate-900 text-white shrink-0 flex flex-col justify-between">
        <div>
            <div class="p-4 font-bold text-base border-b border-slate-800 flex justify-between items-center">
                <span>⚡ 工程計算工具</span>
                <button @click="resetData()" class="text-xs text-slate-400 hover:text-rose-400 font-normal underline">重設數據</button>
            </div>
            <nav class="p-2 flex md:flex-col gap-1 overflow-x-auto">
                <button @click="tab = 'thd'" 
                        :class="tab === 'thd' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'" 
                        class="px-3 py-2.5 rounded-lg text-left text-xs font-semibold whitespace-nowrap transition">
                    1. THD Cal.
                </button>
                <button @click="tab = 'tool2'" 
                        :class="tab === 'tool2' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'" 
                        class="px-3 py-2.5 rounded-lg text-left text-xs font-semibold whitespace-nowrap transition">
                    2. 預留工具 (待加)
                </button>
            </nav>
        </div>
        <div class="hidden md:block p-4 text-[11px] text-slate-500 border-t border-slate-800">
            點擊數字即可彈窗修改
        </div>
    </aside>

    <!-- 右側主畫面 -->
    <main class="flex-1 p-4 md:p-8 overflow-x-auto">
        
        <!-- 工具 1：THD Cal. -->
        <div x-show="tab === 'thd'" class="max-w-2xl bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-lg font-bold text-slate-800">THD Cal.</h1>
                <button @click="addGroup()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                    + 新增一組計算
                </button>
            </div>

            <!-- 仿 Excel 表格 (點擊數字即彈窗) -->
            <div class="overflow-x-auto">
                <table class="w-full border-collapse border border-slate-300 text-sm text-center">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 font-semibold">
                            <th class="border border-slate-300 py-2 px-2 w-12">相</th>
                            <th class="border border-slate-300 py-2 px-3">Current</th>
                            <th class="border border-slate-300 py-2 px-3">THD</th>
                            <th class="border border-slate-300 py-2 px-3">System<br>Current</th>
                            <th class="border border-slate-300 py-2 px-3 bg-amber-50">Final<br>THD</th>
                            <th class="border border-slate-300 py-2 px-1 w-8"></th>
                        </tr>
                    </thead>

                    <template x-for="(group, gIdx) in groups" :key="group.id">
                        <tbody class="border-t-2 border-slate-400">
                            <!-- L1 -->
                            <tr>
                                <td class="border border-slate-300 font-semibold text-xs text-slate-500 bg-slate-50">L1</td>
                                <td class="border border-slate-300 p-3 cursor-pointer hover:bg-indigo-50 font-medium transition"
                                    @click="openEdit(group, 'l1.c', '修改 L1 Current 數值')"
                                    x-text="group.l1.c"></td>
                                <td class="border border-slate-300 p-3 cursor-pointer hover:bg-indigo-50 font-medium transition"
                                    @click="openEdit(group, 'l1.t', '修改 L1 THD 數值')"
                                    x-text="group.l1.t"></td>
                                <!-- System Current 跨三行 -->
                                <td class="border border-slate-300 p-3 cursor-pointer hover:bg-indigo-50 font-bold text-indigo-700 bg-slate-50/50 transition"
                                    rowspan="3"
                                    @click="openEdit(group, 'sys', '修改 System Current 數值')"
                                    x-text="group.sys"></td>
                                <td class="border border-slate-300 font-bold text-slate-900 bg-amber-50/40 px-2" 
                                    x-text="calc(group.l1.c, group.l1.t, group.sys)"></td>
                                <td class="border border-slate-300 bg-slate-50" rowspan="3">
                                    <button @click="removeGroup(group.id)" x-show="groups.length > 1" class="text-slate-400 hover:text-rose-500 text-xs p-1" title="刪除此組">✕</button>
                                </td>
                            </tr>
                            <!-- L2 -->
                            <tr>
                                <td class="border border-slate-300 font-semibold text-xs text-slate-500 bg-slate-50">L2</td>
                                <td class="border border-slate-300 p-3 cursor-pointer hover:bg-indigo-50 font-medium transition"
                                    @click="openEdit(group, 'l2.c', '修改 L2 Current 數值')"
                                    x-text="group.l2.c"></td>
                                <td class="border border-slate-300 p-3 cursor-pointer hover:bg-indigo-50 font-medium transition"
                                    @click="openEdit(group, 'l2.t', '修改 L2 THD 數值')"
                                    x-text="group.l2.t"></td>
                                <td class="border border-slate-300 font-bold text-slate-900 bg-amber-50/40 px-2" 
                                    x-text="calc(group.l2.c, group.l2.t, group.sys)"></td>
                            </tr>
                            <!-- L3 -->
                            <tr>
                                <td class="border border-slate-300 font-semibold text-xs text-slate-500 bg-slate-50">L3</td>
                                <td class="border border-slate-300 p-3 cursor-pointer hover:bg-indigo-50 font-medium transition"
                                    @click="openEdit(group, 'l3.c', '修改 L3 Current 數值')"
                                    x-text="group.l3.c"></td>
                                <td class="border border-slate-300 p-3 cursor-pointer hover:bg-indigo-50 font-medium transition"
                                    @click="openEdit(group, 'l3.t', '修改 L3 THD 數值')"
                                    x-text="group.l3.t"></td>
                                <td class="border border-slate-300 font-bold text-slate-900 bg-amber-50/40 px-2" 
                                    x-text="calc(group.l3.c, group.l3.t, group.sys)"></td>
                            </tr>
                        </tbody>
                    </template>
                </table>
            </div>

            <div class="mt-3 text-xs text-slate-400">
                提示：隨時點擊表格中的任一數值即可彈出視窗修改。公式：Final THD = (Current × THD) ÷ System Current
            </div>
        </div>

        <!-- 預留工具 2 -->
        <div x-show="tab === 'tool2'" class="max-w-2xl bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500 text-sm">
            這裡預留給你的下一個計算工具，隨時告訴我要加什麼公式即可！
        </div>

    </main>

    <!-- 彈出數值修改視窗 (Modal) -->
    <div x-show="modalOpen" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div @click.outside="modalOpen = false" class="bg-white w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl border border-slate-200">
            <h3 class="text-base font-bold text-slate-800" x-text="modalTitle"></h3>
            <div>
                <input type="number" step="any" inputmode="decimal" x-model.number="modalValue" 
                       id="modalInput"
                       class="w-full bg-slate-50 border border-slate-300 focus:border-indigo-500 rounded-xl px-4 py-3 text-xl font-bold text-slate-800 focus:outline-none text-center"
                       @keyup.enter="saveModalValue()">
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button @click="modalOpen = false" class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-3 rounded-xl font-semibold text-xs transition">
                    取消
                </button>
                <button @click="saveModalValue()" class="bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-semibold text-xs transition shadow-md shadow-indigo-600/20">
                    確認修改
                </button>
            </div>
        </div>
    </div>

    <script>
        function app() {
            const STORAGE_KEY = 'simple_thd_cal_v2';
            const defaultGroups = [
                {
                    id: 1,
                    sys: 8.96,
                    l1: { c: 1.07, t: 34.5 },
                    l2: { c: 1.127, t: 32.4 },
                    l3: { c: 0.96, t: 42.5 }
                },
                {
                    id: 2,
                    sys: 15.73,
                    l1: { c: 0.574, t: 112 },
                    l2: { c: 0.516, t: 101 },
                    l3: { c: 0.649, t: 107 }
                }
            ];

            let saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
            if (!saved) saved = JSON.parse(JSON.stringify(defaultGroups));

            return {
                tab: 'thd',
                groups: saved,
                
                // 彈窗控制變數
                modalOpen: false,
                modalTitle: '',
                modalValue: '',
                activeGroup: null,
                activeField: '',

                openEdit(group, field, title) {
                    this.activeGroup = group;
                    this.activeField = field;
                    this.modalTitle = title;

                    // 取得目前數值
                    if (field === 'sys') {
                        this.modalValue = group.sys;
                    } else {
                        let parts = field.split('.'); // 例如 'l1.c' -> ['l1', 'c']
                        this.modalValue = group[parts[0]][parts[1]];
                    }

                    this.modalOpen = true;

                    // 自動聚焦並選取輸入框文字，方便直接輸入
                    setTimeout(() => {
                        const input = document.getElementById('modalInput');
                        if (input) {
                            input.focus();
                            input.select();
                        }
                    }, 50);
                },

                saveModalValue() {
                    const val = Number(this.modalValue);
                    if (this.activeField === 'sys') {
                        this.activeGroup.sys = isNaN(val) ? 0 : val;
                    } else {
                        let parts = this.activeField.split('.');
                        this.activeGroup[parts[0]][parts[1]] = isNaN(val) ? 0 : val;
                    }
                    this.save();
                    this.modalOpen = false;
                },

                calc(c, t, sys) {
                    const current = Number(c) || 0;
                    const thd = Number(t) || 0;
                    const sysCurrent = Number(sys) || 0;
                    if (sysCurrent === 0) return '-';
                    const res = (current * thd) / sysCurrent;
                    return Number(res.toFixed(6));
                },

                addGroup() {
                    this.groups.push({
                        id: Date.now(),
                        sys: 10,
                        l1: { c: 0, t: 0 },
                        l2: { c: 0, t: 0 },
                        l3: { c: 0, t: 0 }
                    });
                    this.save();
                },

                removeGroup(id) {
                    this.groups = this.groups.filter(g => g.id !== id);
                    this.save();
                },

                resetData() {
                    if (confirm('要還原成預設範例數據嗎？')) {
                        this.groups = JSON.parse(JSON.stringify(defaultGroups));
                        this.save();
                    }
                },

                save() {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.groups));
                }
            }
        }
    </script>
</body>
</html>
